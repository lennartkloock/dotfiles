# F1 instead of Ctrl-b
unbind C-b
set -g prefix F1

set-option -g default-shell /usr/bin/fish

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,*:hyperlinks"

# Status
set -g status-interval 1
set -g status-left '#{?client_prefix,#[bg=green] #[bold fg=black]F1 #[default],    } #[bold]#S #[fg=black]┃'
set -g status-right '#{pane_title}'
set -g status-style "bg=default fg=default"
set -g status-right-style bg=default

setw -g window-status-format ' #I #W '
setw -g window-status-current-format ' #I #W '
setw -g window-status-style "bg=default fg=default"
setw -g window-status-current-style "bg=blue fg=black"

set -g window-status-separator '┃'

set -g mouse on
