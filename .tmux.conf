# F1 instead of Ctrl-b
unbind C-b
set -g prefix F1

set -g default-shell /usr/bin/fish

# Open new windows and panes at the same path
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Off keybind
bind-key -T root F12 \
  set prefix None \;\
  set key-table off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel'

bind-key -T off F12 \
  set -u prefix \;\
  set -u key-table

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable true color support and clipboard passthrough
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -as terminal-features ",xterm-256color:RGB,*:hyperlinks,tmux*:clipboard"

# Status
set -g status-interval 1
set -g status-left '#{?#{==:#{client_key_table},off},#[bg=red bold fg=black] F12 #[default],}#{?client_prefix,#[bg=green bold fg=black] F1 #[default] ,}#{?#{||:#{client_prefix},#{==:#{client_key_table},off}},,     } #[bold]#S ┃'
set -g status-right '#{pane_title}'
set -g status-style "bg=default fg=default"
set -g status-right-style bg=default

set -wg window-status-format ' #I #W '
set -wg window-status-current-format ' #I #W '
set -wg window-status-style "bg=default fg=default"
set -wg window-status-current-style "bg=blue fg=black"

set -g window-status-separator '┃'

set -g mouse on
